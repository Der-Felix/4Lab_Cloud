# 4labscloud - Nginx Produktions-Konfiguration
# Einziger oeffentlicher Endpunkt. TLS 1.3 nach BSI TR-02102-2.
# Zertifikate: /etc/letsencrypt/live/<domain>/

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging (ohne IP-Adressen nach DSGVO Art. 5 Datensparsamkeit)
    log_format minimal '$request_method $request_uri $status';
    access_log /var/log/nginx/access.log minimal;
    error_log /var/log/nginx/error.log warn;

    # Sicherheit
    server_tokens off;
    client_max_body_size 5G;

    # Gzip fuer statische Assets aktivieren
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate-Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=100r/s;

    # HTTP -> HTTPS Redirect & Certbot Challenge
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS (TLS 1.3 only)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS 1.3 only (BSI TR-02102-2)
        # Pfad fuer eigene Domain anpassen (z. B. cloud.4labs.local)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_certificate /etc/letsencrypt/live/cloud.4labs.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cloud.4labs.local/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # API -> Go-App
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app-server:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
        }

        # Upload-Chunks (Tus) -> Nginx -> Rust (Upload-Service)
        location /api/v1/uploads/tus {
            limit_req zone=upload burst=50 nodelay;
            proxy_pass http://upload-service:8081;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            client_body_timeout 3600s;
        }

        # Health (internes Monitoring)
        location /health {
            proxy_pass http://app-server:8080;
            access_log off;
        }

        # Frontend -> SvelteKit (Node, Port 3000)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
