# 4labscloud - Nginx als API-Gateway
# Einziger oeffentlicher Endpunkt. TLS 1.3 nach BSI TR-02102-2.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Logging (ohne IP-Adressen nach DSGVO Art. 5)
    log_format minimal '$request_method $request_uri $status';
    access_log /var/log/nginx/access.log minimal;

    # Sicherheit
    server_tokens off;
    client_max_body_size 5G;

    # Rate-Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=100r/s;

    # HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # TLS 1.3 only (BSI TR-02102-2)
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # API -> Go-App
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app-server:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
        }

        # Upload-Chunks (Tus) -> Nginx -> Rust
        location /api/v1/uploads/tus {
            limit_req zone=upload burst=50 nodelay;
            proxy_pass http://upload-service:8081;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            client_body_timeout 3600s;
        }

        # Health (nur intern, kein Auth)
        location /health {
            proxy_pass http://app-server:8080;
            access_log off;
        }

        # Frontend -> SvelteKit (Node, Port 3000)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
