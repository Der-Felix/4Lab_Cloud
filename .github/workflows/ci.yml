name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  go-test:
    name: Go Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/app-server/go.sum

      - name: Run Go Tests with Race Detector
        run: |
          cd services/app-server
          go test -v -race ./...

  rust-test:
    name: Rust Storage Service Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/upload-service/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/upload-service/Cargo.lock') }}

      - name: Run Cargo Clippy
        run: |
          cd services/upload-service
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Cargo Tests
        run: |
          cd services/upload-service
          cargo test --verbose

  frontend-test:
    name: SvelteKit Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck (Svelte-Check)
        run: |
          cd frontend
          npm run check

      - name: Run Unit Tests (Vitest)
        run: |
          cd frontend
          npm run test:unit -- --run

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
