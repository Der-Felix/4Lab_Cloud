# 4labscloud - Podman Compose (Produktion)
# Start: cd deploy/podman/prod && podman-compose --env-file ../../../.env up -d

services:

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: 4labs-prod-postgres
    restart: always
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: 4labs-prod-redis
    restart: always
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  app-server:
    build:
      context: ../../../services/app-server
      dockerfile: Dockerfile
    container_name: 4labs-prod-app-server
    restart: always
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_PORT: ${APP_PORT:-8080}
      IN_CONTAINER: "1"
      GIN_MODE: "release"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-15}
      MFA_KEY: ${MFA_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      DEFAULT_QUOTA_GB: ${DEFAULT_QUOTA_GB:-50}
      UPLOAD_SERVICE_URL: http://upload-service:8081
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  upload-service:
    build:
      context: ../../../services/upload-service
      dockerfile: Dockerfile
    container_name: 4labs-prod-upload-service
    restart: always
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      UPLOAD_PORT: ${UPLOAD_PORT:-8081}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      STORAGE_KEY: ${STORAGE_KEY}
      STORAGE_DIR: /data/storage
      THUMBS_DIR: /data/thumbs
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MAX_UPLOAD_SIZE: "5368709120"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - thumbs_data:/data/thumbs
      - exports_data:/data/exports
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: 4labs-prod-frontend
    restart: always
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 1g
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: 4labs-prod-nginx
    restart: always
    cpus: 2.0
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 200
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - frontend
      - backend
    depends_on:
      app-server:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  storage_data:
  thumbs_data:
  exports_data:
