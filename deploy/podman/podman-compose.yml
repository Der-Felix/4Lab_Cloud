# 4labscloud - Podman Compose
# Start:  cd deploy/podman && podman-compose --env-file ../../.env up -d

services:

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: 4labs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: 4labs-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-server:
    build:
      context: ../../services/app-server
      dockerfile: Dockerfile
    container_name: 4labs-app-server
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      IN_CONTAINER: "1"
      GIN_MODE: "release"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES}
      MFA_KEY: ${MFA_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      DEFAULT_QUOTA_GB: ${DEFAULT_QUOTA_GB:-50}
      UPLOAD_SERVICE_URL: http://upload-service:8081
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  upload-service:
    build:
      context: ../../services/upload-service
      dockerfile: Dockerfile
    container_name: 4labs-upload-service
    restart: unless-stopped
    environment:
      UPLOAD_PORT: ${UPLOAD_PORT}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      STORAGE_KEY: ${STORAGE_KEY}
      STORAGE_DIR: /data/storage
      THUMBS_DIR: /data/thumbs
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MAX_UPLOAD_SIZE: "5368709120"
      NOMINATIM_URL: ${NOMINATIM_URL:-http://nominatim:8080}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - storage_data:/data/storage
      - thumbs_data:/data/thumbs
      - exports_data:/data/exports
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: 4labs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: 4labs-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    depends_on:
      app-server:
        condition: service_healthy
      frontend:
        condition: service_healthy

  nominatim:
    image: docker.io/mediagis/nominatim:4.5
    container_name: 4labs-nominatim
    profiles: ["geocoding"]
    restart: unless-stopped
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/monaco-latest.osm.pbf}
      REVERSE_ONLY: "true"
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  storage_data:
  thumbs_data:
  exports_data:
  nominatim_data:
